<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IDS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hacker-theme.css') }}">
    <style>
        .navbar {
            background: #0D0D0D;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #B5E853;
            box-shadow: 0 2px 10px rgba(181, 232, 83, 0.3);
        }
        
        .navbar h1 {
            font-size: 1.8rem;
            color: #B5E853;
            margin: 0;
        }
        
        .navbar .user-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            color: #FFFFFF;
        }
        
        .navbar .user-info span {
            padding: 8px 16px;
            background: #2A2A2A;
            border: 1px solid #B5E853;
            border-radius: 5px;
        }
        
        .navbar a {
            color: #FF4444;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #FF4444;
            background: #2A2A2A;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .navbar a:hover {
            background: #FF4444;
            color: #1A1A1A;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .content {
            background: transparent;
            border-radius: 0;
            padding: 0;
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: #8D8D8D;
            margin-top: 2rem;
            border-top: 1px dashed #B5E853;
        }
        
        footer p {
            padding: 0;
        }
    </style>
</head>
<body>
    {% if user_id %}
    <div class="navbar fade-in">
        <h1>$ ./IDS.sh</h1>
        <div class="user-info">
            <span>👤 {{ user_id }} <span class="green">[{{ user_role }}]</span></span>
            <a href="/logout">>> Logout</a>
        </div>
    </div>
    {% endif %}
    
    <div class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <footer>
        <p><span class="green">IDS v2.0</span> - Educational Cybersecurity Platform</p>
        <p class="gray">Built with Flask & Scapy</p>
    </footer>
</body>
</html>
