<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IDS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hacker-theme.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .form-group {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1e3c72;
        }
        
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper fade-in">
        <div class="login">
            <h2 class="login-header">$ ./IDS-Login.sh</h2>
            <form class="login-container" method="post">
                {% if error %}
                <div class="alert alert-danger">
                    ⚠️ {{ error }}
                </div>
                {% endif %}
                
                <p>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Username" 
                        required 
                        autofocus
                    >
                </p>
                
                <p>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Password" 
                        required
                    >
                </p>
                
                <p>
                    <input type="submit" value=">> Access System">
                </p>
            </form>
            
            <div class="credentials-info">
                <h3>📝 Test Credentials:</h3>
                <ul style="margin-top: 10px;">
                    <li><span class="green">Attacker:</span> attacker / attack123</li>
                    <li><span class="blue">Defender:</span> defender / defend123</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
